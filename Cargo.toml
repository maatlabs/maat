[workspace]
resolver = "2"
members = [
    "compiler/maat_span",
    "compiler/maat_errors",
    "compiler/maat_field",
    "compiler/maat_lexer",
    "compiler/maat_ast",
    "compiler/maat_parser",
    "compiler/maat_eval",
    "compiler/maat_runtime",
    "compiler/maat_bytecode",
    "compiler/maat_types",
    "compiler/maat_codegen",
    "compiler/maat_vm",
    "compiler/maat_trace",
    "compiler/maat_air",
    "compiler/maat_prover",
    "compiler/maat_module",
    "compiler/maat",
    "library",
    "tests",
]
default-members = ["compiler/maat"]
exclude = ["fuzz"]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maatlabs/maat"
homepage = "https://github.com/maatlabs/maat"
readme = "README.md"

[workspace.dependencies]
maat_span = { path = "compiler/maat_span", version = "0.19.0" }
maat_stdlib = { path = "library", version = "0.19.0" }
maat_errors = { path = "compiler/maat_errors", version = "0.19.0" }
maat_field = { path = "compiler/maat_field", version = "0.19.0" }
maat_lexer = { path = "compiler/maat_lexer", version = "0.19.0" }
maat_ast = { path = "compiler/maat_ast", version = "0.19.0" }
maat_parser = { path = "compiler/maat_parser", version = "0.19.0" }
maat_runtime = { path = "compiler/maat_runtime", version = "0.19.0" }
maat_types = { path = "compiler/maat_types", version = "0.19.0" }
maat_eval = { path = "compiler/maat_eval", version = "0.19.0" }
maat_bytecode = { path = "compiler/maat_bytecode", version = "0.19.0" }
maat_codegen = { path = "compiler/maat_codegen", version = "0.19.0" }
maat_vm = { path = "compiler/maat_vm", version = "0.19.0" }
maat_trace = { path = "compiler/maat_trace", version = "0.19.0" }
maat_air = { path = "compiler/maat_air", version = "0.19.0" }
maat_prover = { path = "compiler/maat_prover", version = "0.19.0" }
maat_module = { path = "compiler/maat_module", version = "0.19.0" }

indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

# Winterfell's prover ships an over-strict `debug_assert_eq!` that requires the
# *exact* per-constraint quotient degree to equal the declared upper bound; on
# small Maat programs that do not exercise every opcode-class selector, dormant
# selector columns interpolate to the zero polynomial and the actual quotient
# degree drops below the declared upper bound. Soundness still holds--FRI checks
# `quotient_degree <= declared`--so we disable `debug_assertions` for the test
# and bench profiles to align with release semantics.
#
# Our own `debug_assert!`s are sanity checks; production builds already run without them.
[profile.test]
debug-assertions = false

[profile.bench]
debug-assertions = false
