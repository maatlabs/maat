name: Fuzz Testing

on:
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - "**/README.md"
      - CHANGELOG.md
      - SECURITY.md
      - LICENSE
      - examples/**
  schedule:
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz-pipeline-pr:
    name: Fuzz pipeline (PR — 60s per target)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fuzz_lexer
          - fuzz_parser
          - fuzz_typechecker
          - fuzz_compiler
          - fuzz_deserializer
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz target (${{ matrix.target }}, 60s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  fuzz-pipeline-nightly:
    name: Fuzz pipeline (nightly — 300s per target)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fuzz_lexer
          - fuzz_parser
          - fuzz_typechecker
          - fuzz_compiler
          - fuzz_deserializer
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz target (${{ matrix.target }}, 300s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300

  fuzz-proof-pr:
    name: Fuzz proof system (PR — 60s per target)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: fuzz_proof_deserializer
            allow_failure: true
          - target: fuzz_verifier
            allow_failure: true
          - target: fuzz_trace_recorder
            allow_failure: false
          - target: fuzz_air_constraints
            allow_failure: false
      fail-fast: false
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Generate seed corpus
        run: cargo run --release -p maat_tests --bin corpus_gen
      - name: Run fuzz target (${{ matrix.target }}, 60s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  fuzz-proof-nightly:
    name: Fuzz proof system (nightly — 300s per target)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: fuzz_proof_deserializer
            allow_failure: true
          - target: fuzz_verifier
            allow_failure: true
          - target: fuzz_trace_recorder
            allow_failure: false
          - target: fuzz_air_constraints
            allow_failure: false
      fail-fast: false
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Generate seed corpus
        run: cargo run --release -p maat_tests --bin corpus_gen
      - name: Run fuzz target (${{ matrix.target }}, 300s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
